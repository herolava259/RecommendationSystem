services:
  name-node:
    image: bde2020/hadoop-name:2.0.0-hadoop3.2.1-java11
    environment:
      - CLUSTER_NAME=test
    ports:
      - "9870:9870"
    volumes:
      - ./hdfs/namenode:/hadoop/dfs/name

  data-node:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java11
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9894:9864"
    volumes:
      - ./hdfs/datanode:/hadoop/dfs/data
    depends_on:
      - name-node

  spark-master:
    image: bitnami/spark:latest
    environment:
      - SPARK_MODE=master
    depends_on:
      - name-node

  spark-worker:
    image: bitnami/spark:latest
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master

  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
    volumes:
      - ./clickhouse:/var/lib/clickhouse
