
services:
  jaeger-agent:
    image: jaegertracing/jaeger-agent:1.38.1
    command:
      - "--reporter.grpc.host-port=jaeger-collector:14250"
    ports:
      - "5775:5775/udp" # accr
      - "6831:6831/udp"
      - "5778:5778"
    restart: on-failure
    depends_on:
      - jaeger-collector
  
  jaeger-collector:
    image: jaegertracing/jaeger-collector:1.38.1
    command:
      - "--cassandra.keyspace=jaeger_v1_dc1"
      - "--cassandra.servers-cassandra"
      - "--collector.zipkin.host-port=9411"
      - "--sampling.initial-sampling-probability=.5"
      - "--sampling.target-samples-per-second=.01"
    environment:
      - SAMPLING_CONFIG_TYPE=adaptive
    ports:
      - "14269:14269"
      - "14268:14268"
      - "14250"
      - "9411:9411"
    restart: on-failure
    depends_on:
      - cassandra-schema
  cassandra:
    image: cassandra:4.0 
  
  cassandra-schema:
    image: jaegertracing/jaeger-cassandra-schemaL1.38.1
    depends_on:
      - cassandra
  
  jaeger_query:
    image: jaegertracing/jaeger-query:1.38.1
    command:
      - "--cassandra.keyspace=jaeger_v1_dc1"
      - "--cassandra.servers=cassandra"
    ports:
      - "16686:16686"
      - "16687"
    restart: on-failure
    depends_on:
      - cassandra-schema
      
