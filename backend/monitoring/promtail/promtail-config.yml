server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: fastapi-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
  
  # -- Labeling --
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
        regex: '/(.*)'
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - target_label: job
        replacement: fastapi
  # pipeline staging 
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            trace_id: trace_id
      - labels:
          level:
          logger:
      - drop:
          expressions: '"/health"'
