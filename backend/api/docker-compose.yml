services:
  rec_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - appdb
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  appdb:
    image: postgres:17.4
    container_name: postgresappdb
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - app_db_data:/var/lib/postgresql/data/
    env_file:
      - .env
    networks:
      - app_rec_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: no
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/root/.pgadmin
    networks:
      - app_rec_network
    depends_on:
      - appdb
    env_file:
      - .env

networks:
  app_rec_network:
    driver: bridge
    name: app_rec_network

volumes:
  pgadmin_data:
    driver: local
    external: false
  app_db_data:
    driver: local
    external: false


