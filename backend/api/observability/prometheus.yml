global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "spm-metrics"
    metrics_path: '/metrics'
    static_configs:
      - targets: ["spm_metrics_source:8889"]

  - job_name: "recapi-app"
    scrape_interval: 5s
    static_configs:
      - targets: ["fastapi:8000"]
