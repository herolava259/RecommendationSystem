
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart:
      always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - observability

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "-config.file=/etc/promtail/config.yml"
    networks:
      - observability
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-latest}
    container_name: jaeger
    restart: always
    ports:
      - "0.0.0.0:16686:16686" # UI
      - "0.0.0.0:8888:8888"
      - "0.0.0.0:8889:8889"
      - "0.0.0.0:4317:4317" # OTLP gRPC
      - "0.0.0.0:4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - OTEL_ENABLED=true
    command:
      ["--config", "/etc/jaeger/config.yml"]
    volumes:
      - "./jaeger-ui.json:/etc/jaeger/jaeger-ui.json"
      - "./jaeger-config.yml:/etc/jaeger/config.yml"
    networks:
      observability:
        aliases: [ spm_metrics_source ]
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - jaeger
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - observability
    volumes:
      - grafana-data:/var/lib/grafana

  # with otel-collector like proxy/processors  collect traces/logs/,metrics and send them to exporters (Jaeger, Prometheus)
  # flow: Receivers(App + SDK) ---> Processors(Open-Telemetry Collector) ----> Exporters(Jaeger(trace) and Prometheus(metrics))

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver



networks:
  observability:
    driver: bridge

volumes:
  grafana-data:
    driver: local
    external: false



